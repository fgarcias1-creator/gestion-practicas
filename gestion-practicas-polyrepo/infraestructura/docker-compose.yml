# Orquesta TODO el sistema. Cada servicio se construye desde SU propia carpeta (su propio repositorio).
# Uso:  cp .env.example .env  &&  docker compose up --build -d
name: gestion-practicas

x-secretos: &secretos
  JWT_SECRET: ${JWT_SECRET:-cambie-este-secreto-en-produccion}
  INTERNAL_KEY: ${INTERNAL_KEY:-cambie-esta-clave-interna}

services:
  # ------------------------- Bases de datos -------------------------
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: practicas, POSTGRES_PASSWORD: practicas, POSTGRES_DB: practicas }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U practicas -d practicas"], interval: 3s, timeout: 3s, retries: 20 }

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

  # Bandeja de correo de PRUEBAS: recibe todos los correos del sistema (rechazos y asignaciones) y los muestra en http://localhost:8025
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  # Se ejecuta una vez: crea el esquema y los datos demo SOLO si la base está vacía
  db-init:
    build: .
    environment:
      PG_URL: postgres://practicas:practicas@postgres:5432/practicas
      MONGO_URL: mongodb://mongo:27017/practicas_seguimiento
    depends_on: { postgres: { condition: service_healthy }, mongo: { condition: service_started } }
    restart: "no"

  # ------------------------- Microservicios -------------------------
  servicio-identidad:
    build: ../servicio-identidad
    environment:
      <<: *secretos
      PORT_IDENTIDAD: 3001
      JWT_EXPIRES: 8h
      PG_URL: postgres://practicas:practicas@postgres:5432/practicas
      URL_PRACTICAS: http://servicio-practicas:3002
      URL_SEGUIMIENTO: http://servicio-seguimiento:3003
      # Administrador inicial (si la base no tiene ninguno). Cambie la contraseña en el .env antes de publicar el sistema.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@udi.edu.co}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Practicas2026*}
    ports: ["3001:3001"]
    depends_on: { db-init: { condition: service_completed_successfully } }

  servicio-practicas:
    build: ../servicio-practicas
    environment:
      <<: *secretos
      PORT_PRACTICAS: 3002
      PG_URL: postgres://practicas:practicas@postgres:5432/practicas
      URL_SEGUIMIENTO: http://servicio-seguimiento:3003
      SMTP_HOST: mailhog          # correos reales hacia la bandeja de pruebas (http://localhost:8025)
      SMTP_PORT: 1025
    ports: ["3002:3002"]
    depends_on: { db-init: { condition: service_completed_successfully }, mailhog: { condition: service_started } }

  servicio-seguimiento:
    build: ../servicio-seguimiento
    environment:
      <<: *secretos
      PORT_SEGUIMIENTO: 3003
      MONGO_URL: mongodb://mongo:27017/practicas_seguimiento
      URL_PRACTICAS: http://servicio-practicas:3002
      URL_EVALUACION: http://servicio-evaluacion:3004
    volumes: [evidencias:/app/src/uploads]
    ports: ["3003:3003"]
    depends_on: { db-init: { condition: service_completed_successfully } }

  servicio-evaluacion:
    build: ../servicio-evaluacion
    environment:
      <<: *secretos
      PORT_EVALUACION: 3004
      PG_URL: postgres://practicas:practicas@postgres:5432/practicas
      URL_PRACTICAS: http://servicio-practicas:3002
      URL_SEGUIMIENTO: http://servicio-seguimiento:3003
    ports: ["3004:3004"]
    depends_on: { db-init: { condition: service_completed_successfully } }

  servicio-reportes:
    build: ../servicio-reportes
    environment:
      <<: *secretos
      PORT_REPORTES: 3005
      URL_PRACTICAS: http://servicio-practicas:3002
      URL_SEGUIMIENTO: http://servicio-seguimiento:3003
      URL_EVALUACION: http://servicio-evaluacion:3004
    ports: ["3005:3005"]

  # ------------------------- Gateway y frontend -------------------------
  api-gateway:
    build: ../api-gateway
    environment:
      <<: *secretos
      PORT_GATEWAY: 3000
      URL_IDENTIDAD: http://servicio-identidad:3001
      URL_PRACTICAS: http://servicio-practicas:3002
      URL_SEGUIMIENTO: http://servicio-seguimiento:3003
      URL_EVALUACION: http://servicio-evaluacion:3004
      URL_REPORTES: http://servicio-reportes:3005
    ports: ["3000:3000"]
    depends_on: [servicio-identidad, servicio-practicas, servicio-seguimiento, servicio-evaluacion, servicio-reportes]

  frontend:
    build: ../frontend
    ports: ["8080:80"]
    depends_on: [api-gateway]

volumes:
  pgdata:
  mongodata:
  evidencias:
