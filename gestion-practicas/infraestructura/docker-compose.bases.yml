# Solo PostgreSQL y MongoDB, para desarrollar los servicios con `npm start` en tu máquina.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: practicas, POSTGRES_PASSWORD: practicas, POSTGRES_DB: practicas }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
volumes:
  pgdata:
  mongodata:
